<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datepicker UI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="datepicker-container">
        <!-- Input Group -->
        <div class="datepicker-input-group">
            <input type="text" placeholder="dd / mm / yyyy" class="datepicker-input">
            <button class="datepicker-button">
                <!-- SVG Calendar Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"
                    stroke="none">
                    <path
                        d="M19 4h-1V3c0-.55-.45-1-1-1s-1 .45-1 1v1H8V3c0-.55-.45-1-1-1s-1 .45-1 1v1H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5v-5z" />
                </svg>
            </button>
        </div>

        <!-- Calendar Dropdown (Absolutely Positioned) -->
        <div class="datepicker-calendar">
            <div class="calendar-header">
                <button class="nav-button prev-month">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                        <path d="M14 7l-5 5 5 5V7z" />
                    </svg>
                </button>
                <span class="current-month">December 2022</span>
                <button class="nav-button next-month">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                        <path d="M10 17l5-5-5-5v10z" />
                    </svg>
                </button>
            </div>

            <div class="calendar-grid">
                <!-- Weekdays -->
                <div class="weekday">S</div>
                <div class="weekday">M</div>
                <div class="weekday">T</div>
                <div class="weekday">W</div>
                <div class="weekday">T</div>
                <div class="weekday">F</div>
                <div class="weekday">S</div>

                <!-- Days -->
                <!-- Empty slots for days before 1st -->
                <div class="day empty"></div>
                <div class="day empty"></div>
                <div class="day empty"></div>
                <div class="day empty"></div>
                <div class="day">1</div>
                <div class="day">2</div>
                <div class="day">3</div>

                <div class="day">4</div>
                <div class="day">5</div>
                <div class="day">6</div>
                <div class="day">7</div>
                <div class="day">8</div>
                <div class="day">9</div>
                <div class="day">10</div>

                <div class="day">11</div>
                <div class="day">12</div>
                <div class="day">13</div>
                <div class="day">14</div>
                <div class="day">15</div>
                <div class="day">16</div>
                <div class="day">17</div>

                <div class="day">18</div>
                <div class="day">19</div>
                <div class="day">20</div>
                <div class="day">21</div>
                <div class="day">22</div>
                <div class="day">23</div>
                <div class="day">24</div>

                <div class="day">25</div>
                <div class="day">26</div>
                <div class="day selected">27</div>
                <div class="day">28</div>
                <div class="day">29</div>
                <div class="day">30</div>
                <div class="day">31</div>
            </div>
        </div>
    </div>

</body>

</html>
